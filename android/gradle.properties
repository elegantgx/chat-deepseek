# CI 的 ubuntu-latest 只有 4 vCPU/16 GB，AGP + Kotlin 编译峰值经常超过默认 512m 堆；
# 2g 是这一档工程的安全下限，给足可以避免构建随机 OOM（OOM 会以 daemon 消失的形式出现，很难排查）。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# 并行与缓存都开着：CI 每次全新 checkout，但 Gradle 用户目录由 setup-gradle 缓存，第二次就能命中。
org.gradle.parallel=true
org.gradle.caching=true
# 工程只用 AndroidX，不允许旧 support 库混进来。
android.useAndroidX=true
# 每个模块只生成自己的 R 类，减少编译期符号面；单模块下行为等价。
android.nonTransitiveRClass=true
kotlin.code.style=official
