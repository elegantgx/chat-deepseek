# Electron 桌面端打包配置。
#
# 版本来自根 package.json（0.1.5-official0.1.4，合法 semver 预发布）；
# 产物名统一用 v<package.json 版本>，与发布 tag（v0.1.5-official0.1.4）保持一致。
# 输出统一写到 release/desktop（已被根 .gitignore 的 /release/ 覆盖），
# 不复用根 dist/ —— 那是 Web UI 的构建目录。
#
# Linux/macOS 出便携 zip，Windows 出单文件 NSIS 安装包（见文件末尾的 nsis 段）。
# 包里的 Go 二进制既是 GUI 的后端，也是可单独使用的 CLI：
# Linux/Windows 在 <应用目录>/resources/bin/，macOS 在 chat-deepseek.app/Contents/Resources/bin/。
appId: com.chatdeepseek.desktop
productName: chat-deepseek
copyright: Copyright © chat-deepseek contributors

directories:
  output: release/desktop
  buildResources: desktop/build

# 只把编译产物和 package.json 放进 asar：
# - desktop/package.json 必须与 desktop/dist/main.js 同包，最近的 package.json 决定 CJS 解析；
# - 主进程 / preload 只用 electron 与 Node 内置模块，渲染层已由 rspack 打包，
#   因此 node_modules 全部排除，避免把 React/KaTeX/Mermaid 这些构建期依赖塞进安装包。
files:
  - package.json
  - desktop/package.json
  - desktop/dist/**/*
  - '!desktop/dist/**/*.map'
  - '!node_modules/**/*'

# Go 二进制由 scripts/build-desktop-backend.mjs 构建到这里。
extraResources:
  - from: desktop/build/backend/bin
    to: bin

asar: true
# 没有原生模块需要重建，跳过 node-gyp 流程
npmRebuild: false

linux:
  target:
    - target: zip
      arch:
        - x64
  icon: desktop/build/whale.png
  category: Utility
  artifactName: chat-deepseek-v${version}-linux-amd64.${ext}

mac:
  target:
    - target: zip
      arch:
        - arm64
  icon: desktop/build/whale.icns
  category: public.app-category.utilities
  # CI 没有 Apple 开发者证书：显式关闭签名，产物是未签名 zip
  identity: null
  artifactName: chat-deepseek-v${version}-macos-arm64.${ext}

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: desktop/build/whale.ico
  artifactName: chat-deepseek-v${version}-windows-amd64-setup.${ext}

# Windows 只出 NSIS 安装包：zip 解压是一堆 dll/resources，普通用户要在一堆文件里找 exe；
# 单文件 setup 双击安装到用户目录，开始菜单/桌面快捷方式由安装器创建，不需要管理员权限。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: chat-deepseek
