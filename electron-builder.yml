# Electron 桌面端打包配置。
#
# 版本来自根 package.json（0.1.5-official0.1.4，合法 semver 预发布），
# 产物统一写到 release/desktop（已被根 .gitignore 的 /release/ 覆盖），
# 不复用根 dist/ —— 那是 Web UI 的构建目录。
#
# 三个平台都只出便携 zip：下载解压就能用，不做 NSIS/dmg/tar.gz 安装包。
# zip 里的 Go 二进制既是 GUI 的后端，也是可单独使用的 CLI：
# Linux/Windows 在 <应用目录>/resources/bin/，macOS 在 chat-deepseek.app/Contents/Resources/bin/。
appId: com.chatdeepseek.desktop
productName: chat-deepseek
copyright: Copyright © chat-deepseek contributors

directories:
  output: release/desktop
  buildResources: desktop/build

# 只把编译产物和 package.json 放进 asar：
# - desktop/package.json 必须与 desktop/dist/main.js 同包，最近的 package.json 决定 CJS 解析；
# - 主进程 / preload 只用 electron 与 Node 内置模块，渲染层已由 rspack 打包，
#   因此 node_modules 全部排除，避免把 React/KaTeX/Mermaid 这些构建期依赖塞进安装包。
files:
  - package.json
  - desktop/package.json
  - desktop/dist/**/*
  - '!desktop/dist/**/*.map'
  - '!node_modules/**/*'

# Go 二进制由 scripts/build-desktop-backend.mjs 构建到这里。
extraResources:
  - from: desktop/build/backend/bin
    to: bin

asar: true
# 没有原生模块需要重建，跳过 node-gyp 流程
npmRebuild: false

linux:
  target:
    - target: zip
      arch:
        - x64
  icon: desktop/build/whale.png
  category: Utility
  artifactName: chat-deepseek-${version}-linux-amd64.${ext}

mac:
  target:
    - target: zip
      arch:
        - arm64
  icon: desktop/build/whale.icns
  category: public.app-category.utilities
  # CI 没有 Apple 开发者证书：显式关闭签名，产物是未签名 zip
  identity: null
  artifactName: chat-deepseek-${version}-macos-arm64.${ext}

win:
  target:
    - target: zip
      arch:
        - x64
  icon: desktop/build/whale.ico
  artifactName: chat-deepseek-${version}-windows-amd64.${ext}
