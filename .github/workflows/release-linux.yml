name: Release Linux

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CGO_ENABLED: '0'

jobs:
  release:
    name: Build linux-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        # electron-builder 的可选依赖 electron-winstaller（Squirrel.Windows 用）会触发
        # pnpm 12 的构建审批错误；桌面端只出 NSIS，显式拒绝它的构建脚本。
        run: pnpm install --frozen-lockfile --allow-build '!electron-winstaller'
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go binaries
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          pnpm desktop:backend
          mkdir -p tmp/release/server
          install -m 0755 desktop/build/backend/bin/chat-deepseek tmp/release/server/chat-deepseek
      - name: Build desktop bundles
        run: pnpm desktop:build
      - name: Package desktop (tar.gz)
        run: |
          set -euo pipefail
          pnpm exec electron-builder --linux tar.gz --publish never
          tarball=$(ls release/desktop/chat-deepseek-desktop-*-linux-x86_64.tar.gz)
          # 后端二进制必须随包放在 resources/bin，否则打包后的桌面端只能显示 backend_unavailable
          tar -tzf "$tarball" | grep -qE '^[^/]+/resources/bin/chat-deepseek$'
          rm -rf tmp/verify
          mkdir -p tmp/verify
          tar -xzf "$tarball" -C tmp/verify
          test -x tmp/verify/*/resources/bin/chat-deepseek
          ls -lh "$tarball"
      - name: Package server archive
        run: |
          set -euo pipefail
          archive="chat-deepseek-${VERSION}-linux-amd64.zip"
          rm -f "$archive"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md tmp/release/server/
          chmod 0644 tmp/release/server/README.md tmp/release/server/LICENSE tmp/release/server/THIRD_PARTY_NOTICES.md
          ./tmp/release/server/chat-deepseek version
          (cd tmp/release/server && zip -9 -r "$GITHUB_WORKSPACE/${archive}" .)
          unzip -l "$archive"
          ls -lh "$archive"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: |
            chat-deepseek-*-linux-amd64.zip
            release/desktop/*.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          server="chat-deepseek-${VERSION}-linux-amd64.zip"
          desktop=$(ls release/desktop/chat-deepseek-desktop-*-linux-x86_64.tar.gz)
          test -f "$server"
          test -f "$desktop"
          assets=("$server" "$desktop")
          # 三个 workflow 可能同时打到同一个 tag：创建/上传都按竞态重试
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" "${assets[@]}" --clobber; then
                exit 0
              fi
            elif gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes; then
              exit 0
            fi
            sleep 5
          done
          echo "failed to publish $tag" >&2
          exit 1
