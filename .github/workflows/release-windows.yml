name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CGO_ENABLED: '0'

jobs:
  release:
    name: Build windows-amd64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        # electron-winstaller 的构建审批已记录在仓库根的 pnpm-workspace.yaml
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go backend
        env:
          GOOS: windows
          GOARCH: amd64
        run: pnpm desktop:backend
      - name: Build desktop bundles
        run: pnpm desktop:build
      - name: Package desktop (NSIS)
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          pnpm exec electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
          $installer = Get-ChildItem -Path release\desktop -File -Filter "chat-deepseek-*-windows-amd64-setup.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS setup not found" }
          # 后端二进制必须打进安装包：先在 electron-builder 的 win-unpacked 里确认它能跑
          $backend = "release\desktop\win-unpacked\resources\bin\chat-deepseek.exe"
          if (-not (Test-Path $backend)) { throw "backend binary missing from win-unpacked" }
          & $backend version
          if ($LASTEXITCODE -ne 0) { throw "backend binary failed to run" }
          Get-Item $installer.FullName | Format-List Length,FullName
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: release/desktop/*-windows-amd64-setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $desktop = Get-ChildItem -Path release\desktop -File -Filter "chat-deepseek-*-windows-amd64-setup.exe" | Select-Object -First 1
          if ($null -eq $desktop) { throw "release asset not found" }
          # gh 把资产参数当作 glob；Windows 反斜杠会被当成转义符。
          $asset = $desktop.FullName -replace '\\', '/'
          $published = $false
          for ($attempt = 0; $attempt -lt 6 -and -not $published; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $asset --clobber
              if ($LASTEXITCODE -eq 0) {
                $published = $true
              }
            } else {
              gh release create $tag $asset --title $tag --generate-notes
              if ($LASTEXITCODE -eq 0) {
                $published = $true
              }
            }
            if (-not $published) {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $published) {
            throw "Failed to publish release"
          }
