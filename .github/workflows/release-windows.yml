name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CGO_ENABLED: '0'

jobs:
  release:
    name: Build windows-amd64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        # electron-builder 的可选依赖 electron-winstaller（Squirrel.Windows 用）会触发
        # pnpm 12 的构建审批错误；桌面端只出 NSIS，显式拒绝它的构建脚本。
        run: pnpm install --frozen-lockfile --allow-build '!electron-winstaller'
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go binaries
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"
          pnpm desktop:backend
          New-Item -ItemType Directory -Force tmp\release\server | Out-Null
          Copy-Item desktop\build\backend\bin\chat-deepseek.exe tmp\release\server\chat-deepseek.exe
      - name: Build desktop bundles
        run: pnpm desktop:build
      - name: Package desktop (NSIS)
        run: |
          $ErrorActionPreference = "Stop"
          pnpm exec electron-builder --win nsis --publish never
          $installer = Get-ChildItem -Path release\desktop -File -Filter "chat-deepseek-desktop-*-windows-x64.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer not found" }
          Get-Item $installer.FullName | Format-List Length,FullName
      - name: Package server archive
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "chat-deepseek-$env:VERSION-windows-amd64.zip"
          Remove-Item -Force $archive -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md tmp/release/server/
          & .\tmp\release\server\chat-deepseek.exe version
          Compress-Archive -Path tmp\release\server\* -DestinationPath $archive -Force
          Get-Item $archive | Format-List Length,FullName
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-amd64
          path: |
            chat-deepseek-*-windows-amd64.zip
            release/desktop/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $server = Get-ChildItem -Path . -File -Filter "chat-deepseek-*-windows-amd64.zip" | Select-Object -First 1
          $desktop = Get-ChildItem -Path release\desktop -File -Filter "chat-deepseek-desktop-*-windows-x64.exe" | Select-Object -First 1
          if ($null -eq $server -or $null -eq $desktop) { throw "release assets not found" }
          # gh 把资产参数当作 glob；Windows 反斜杠会被当成转义符。
          $assets = @(
            ($server.FullName -replace '\\', '/'),
            ($desktop.FullName -replace '\\', '/')
          )
          $published = $false
          for ($attempt = 0; $attempt -lt 6 -and -not $published; $attempt++) {
            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $assets --clobber
              if ($LASTEXITCODE -eq 0) {
                $published = $true
              }
            } else {
              gh release create $tag $assets --title $tag --generate-notes
              if ($LASTEXITCODE -eq 0) {
                $published = $true
              }
            }
            if (-not $published) {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $published) {
            throw "Failed to publish release"
          }
