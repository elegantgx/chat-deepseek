name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CGO_ENABLED: '0'
  # 没有开发者证书；关闭 electron-builder 的证书自动发现，按 mac.identity: null 出未签名 dmg
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    name: Build macos-arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Check architecture
        run: test "$(uname -m)" = "arm64"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        # electron-builder 的可选依赖 electron-winstaller（Squirrel.Windows 用）会触发
        # pnpm 12 的构建审批错误；桌面端只出 NSIS，显式拒绝它的构建脚本。
        run: pnpm install --frozen-lockfile --allow-build '!electron-winstaller'
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go binaries
        env:
          GOOS: darwin
          GOARCH: arm64
        run: |
          set -euo pipefail
          pnpm desktop:backend
          mkdir -p tmp/release/server
          install -m 0755 desktop/build/backend/bin/chat-deepseek tmp/release/server/chat-deepseek
      - name: Build desktop bundles
        run: pnpm desktop:build
      - name: Package desktop (dmg)
        run: |
          set -euo pipefail
          pnpm exec electron-builder --mac dmg --publish never
          dmg=$(ls release/desktop/chat-deepseek-desktop-*-macos-arm64.dmg)
          ls -lh "$dmg"
      - name: Package server archive
        run: |
          set -euo pipefail
          archive="chat-deepseek-${VERSION}-macos-arm64.zip"
          rm -f "$archive"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md tmp/release/server/
          chmod 0644 tmp/release/server/README.md tmp/release/server/LICENSE tmp/release/server/THIRD_PARTY_NOTICES.md
          ./tmp/release/server/chat-deepseek version
          (cd tmp/release/server && zip -9 -r "$GITHUB_WORKSPACE/${archive}" .)
          unzip -l "$archive"
          ls -lh "$archive"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            chat-deepseek-*-macos-arm64.zip
            release/desktop/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          server="chat-deepseek-${VERSION}-macos-arm64.zip"
          desktop=$(ls release/desktop/chat-deepseek-desktop-*-macos-arm64.dmg)
          test -f "$server"
          test -f "$desktop"
          assets=("$server" "$desktop")
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" "${assets[@]}" --clobber; then
                exit 0
              fi
            elif gh release create "$tag" "${assets[@]}" --title "$tag" --generate-notes; then
              exit 0
            fi
            sleep 5
          done
          echo "failed to publish $tag" >&2
          exit 1
