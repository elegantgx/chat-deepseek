name: Release macOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  CGO_ENABLED: '0'
  # 没有开发者证书；关闭 electron-builder 的证书自动发现，按 mac.identity: null 出未签名 zip
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  release:
    name: Build macos-arm64
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v6
      - name: Check architecture
        run: test "$(uname -m)" = "arm64"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.23.0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        # electron-winstaller 的构建审批已记录在仓库根的 pnpm-workspace.yaml
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm type
      - name: Lint
        run: pnpm lint
      - name: Build web UI
        env:
          NODE_ENV: production
        run: pnpm build
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go backend
        env:
          GOOS: darwin
          GOARCH: arm64
        run: pnpm desktop:backend
      - name: Build desktop bundles
        run: pnpm desktop:build
      - name: Package desktop (zip)
        run: |
          set -euo pipefail
          pnpm exec electron-builder --mac zip --publish never
          archive=$(ls release/desktop/chat-deepseek-*-macos-arm64.zip)
          # 后端二进制必须随包放在 .app/Contents/Resources/bin，否则打包后的桌面端只能显示 backend_unavailable
          unzip -l "$archive" | grep -qE 'chat-deepseek\.app/Contents/Resources/bin/chat-deepseek$'
          rm -rf tmp/verify
          mkdir -p tmp/verify
          unzip -q "$archive" -C tmp/verify
          test -x tmp/verify/chat-deepseek.app/Contents/MacOS/chat-deepseek
          backend=tmp/verify/chat-deepseek.app/Contents/Resources/bin/chat-deepseek
          chmod +x "$backend"
          "$backend" version
          ls -lh "$archive"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: release/desktop/*-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          desktop=$(ls release/desktop/chat-deepseek-*-macos-arm64.zip)
          test -f "$desktop"
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" "$desktop" --clobber; then
                exit 0
              fi
            elif gh release create "$tag" "$desktop" --title "$tag" --generate-notes; then
              exit 0
            fi
            sleep 5
          done
          echo "failed to publish $tag" >&2
          exit 1
