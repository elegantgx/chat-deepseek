    <div class="phone is-drawer">
      <!-- 抽屉下面：会话页（被白色蒙层压淡，只露出右侧一条） -->
      <div class="page" aria-hidden="true">
        <div class="page-dim">
        <header class="chat-header">
          <button class="icon-btn"><svg width="22" height="22"><use href="#i-menu" /></svg></button>
          <div class="chat-title">用 Go 实现文件监听</div>
          <button class="icon-btn"><svg width="20" height="20"><use href="#i-newchat" /></svg></button>
        </header>
        <div class="chat-scroll">
          <div class="msg-user">
            <div class="bubble">给文件夹加个监听，文件一变就重新编译</div>
          </div>
          <div class="msg-assistant">
            可以用 fsnotify 监听目录事件，配合 200ms 防抖；保存时先取消上一次定时器，再触发构建。
          </div>
        </div>
        <div class="composer-dock">
          <div class="composer">
            <div class="input-line">发消息或按住说话</div>
            <div class="function-row">
              <div class="toggles">
                <span class="toggle is-on"><svg><use href="#i-think" /></svg>深度思考</span>
                <span class="toggle is-on"><svg><use href="#i-globe" /></svg>智能搜索</span>
              </div>
              <div class="right">
                <button class="tool-btn"><svg width="16" height="16"><use href="#i-mic" /></svg></button>
                <button class="tool-btn"><svg width="16" height="16"><use href="#i-clip" /></svg></button>
                <button class="send-btn is-disabled"><svg width="16" height="16"><use href="#i-send" /></svg></button>
              </div>
            </div>
          </div>
          <div class="caveat">回答由 AI 生成，仅供参考</div>
        </div>
        </div>
      </div>

      <!-- 抽屉 -->
      <aside class="drawer" aria-label="会话历史">
        <div class="drawer-search">
          <svg width="22" height="22"><use href="#i-search" /></svg>
          <span>搜索对话内容...</span>
        </div>

        <div class="drawer-body">
          <div class="section-head">
            <span>今天</span>
            <svg width="20" height="20"><use href="#i-sort" /></svg>
          </div>
          <div class="session-row is-active">
            <span class="session-title">用 Go 实现文件监听</span>
            <span class="session-more"><svg width="18" height="18"><use href="#i-ellipsis" /></svg></span>
          </div>
          <div class="session-row">
            <span class="session-title">Android 端服务器切换方案</span>
          </div>

          <div class="section-head">
            <span>昨天</span>
          </div>
          <div class="session-row">
            <span class="session-title">备份恢复流程</span>
          </div>
        </div>

        <div class="drawer-bottom">
          <div class="avatar"><svg width="20" height="20"><use href="#i-user" /></svg></div>
          <div class="who">
            <div class="name">owner</div>
          </div>
          <button class="drawer-more"><svg width="18" height="18"><use href="#i-ellipsis" /></svg></button>
        </div>
      </aside>

      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12"><use href="#i-signal" /></svg>
          <svg width="16" height="12"><use href="#i-wifi" /></svg>
          <svg width="26" height="12"><use href="#i-battery" /></svg>
        </span>
      </div>
    </div>

</html>
