<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
    <title>本机备份（创建中）</title>
    <link rel="stylesheet" href="../mockup.css" />
  </head>
  <body>
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M14.8 5.6 9.2 12l5.6 6.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-archive" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.1" y="3.6" width="17.8" height="4.6" rx="1.6" />
            <path d="M4.6 8.2v10.6a1.6 1.6 0 0 0 1.6 1.6h11.6a1.6 1.6 0 0 0 1.6-1.6V8.2" />
            <path d="M9.6 12.4h4.8" />
          </g>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
          <path d="M12 5.4v13.2M5.4 12h13.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
        </symbol>
        <symbol id="i-signal" viewBox="0 0 18 12">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor" />
          <rect x="5" y="6" width="3" height="6" rx="1" fill="currentColor" />
          <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="currentColor" />
          <rect x="15" y="1" width="3" height="11" rx="1" fill="currentColor" />
        </symbol>
        <symbol id="i-wifi" viewBox="0 0 16 12">
          <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.6 7a6.6 6.6 0 0 1 8.8 0M6 9.5a3.2 3.2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="8" cy="11" r="1" fill="currentColor" />
        </symbol>
        <symbol id="i-battery" viewBox="0 0 26 12">
          <rect x="0.7" y="1.2" width="22" height="9.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45" />
          <rect x="2.6" y="3.1" width="16.2" height="5.8" rx="1.8" fill="currentColor" />
          <path d="M24.4 4.2v3.6c.9-.3 1.4-.9 1.4-1.8s-.5-1.5-1.4-1.8z" fill="currentColor" opacity="0.45" />
        </symbol>
      </defs>
    </svg>

    <div class="phone settings-page">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12"><use href="#i-signal" /></svg>
          <svg width="16" height="12"><use href="#i-wifi" /></svg>
          <svg width="26" height="12"><use href="#i-battery" /></svg>
        </span>
      </div>

      <header class="settings-appbar">
        <button class="back-btn" aria-label="返回">
          <svg width="18" height="18"><use href="#i-back" /></svg>
        </button>
        <h1 class="settings-title">本机备份</h1>
        <span></span>
      </header>

      <div class="server-content">
        <div class="status-card">
          <div class="status-head">
            <span class="status-dot is-busy"></span>
            <span class="status-text">创建中</span>
          </div>

          <div class="kv-list">
            <div class="kv">
              <span class="kv-label">时间</span>
              <span class="kv-value">2026-11-27 09:38</span>
            </div>
            <div class="kv">
              <span class="kv-label">位置</span>
              <span class="kv-value">data/backups</span>
            </div>
          </div>

          <div class="progress-block">
            <div class="progress-head">
              <span class="ph-label">正在打包会话与附件…</span>
              <span class="ph-value">62%</span>
            </div>
            <div class="progress"><span class="bar" style="width: 62%"></span></div>
            <div class="progress-foot">
              <span>12.4 MB / 20.0 MB</span>
              <span>约 8 秒</span>
            </div>
          </div>

          <div class="status-actions">
            <button class="btn btn-primary is-loading" type="button" disabled>
              <span class="spinner"></span>
              正在创建
            </button>
          </div>
        </div>

        <div class="backup-list">
          <div class="settings-label">备份</div>
          <div class="settings-card">
            <div class="settings-row is-muted">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-plus" /></svg></span>
              <span class="s-main">新建备份</span>
              <span class="s-value">创建进行中</span>
            </div>
            <div class="settings-row is-muted">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-archive" /></svg></span>
              <span class="s-main">2026-11-26 02:14</span>
              <span class="s-value">48.2 MB</span>
            </div>
            <div class="settings-row is-muted">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-archive" /></svg></span>
              <span class="s-main">2026-11-19 02:00</span>
              <span class="s-value">47.9 MB</span>
            </div>
            <div class="settings-row is-muted">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-archive" /></svg></span>
              <span class="s-main">2026-11-12 01:30</span>
              <span class="s-value">46.1 MB</span>
            </div>
            <div class="settings-row is-muted">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-archive" /></svg></span>
              <span class="s-main">2026-11-05 02:00</span>
              <span class="s-value">45.8 MB</span>
            </div>
            <div class="settings-row is-muted">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-archive" /></svg></span>
              <span class="s-main">2026-10-29 02:00</span>
              <span class="s-value">45.2 MB</span>
            </div>
          </div>

          <p class="loop-note">创建完成后会加入备份列表。</p>
        </div>
      </div>
    </div>
  </body>
</html>
