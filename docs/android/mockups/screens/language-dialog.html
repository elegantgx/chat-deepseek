<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
    <title>36 语言（单选弹窗）</title>
    <link rel="stylesheet" href="../mockup.css" />
  </head>
  <body>
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M14.8 5.6 9.2 12l5.6 6.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="M9.6 5.8 15.9 12l-6.3 6.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-server" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9">
            <rect x="3.1" y="4.1" width="17.8" height="6.6" rx="2.1" />
            <rect x="3.1" y="13.3" width="17.8" height="6.6" rx="2.1" />
            <path d="M11.2 7.4h5.6M11.2 16.6h5.6" stroke-linecap="round" />
            <circle cx="7.1" cy="7.4" r="1.05" fill="currentColor" stroke="none" />
            <circle cx="7.1" cy="16.6" r="1.05" fill="currentColor" stroke="none" />
          </g>
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="7.8" r="3.7" />
            <path d="M4.9 20.1c0-3.3 3.2-5.4 7.1-5.4s7.1 2.1 7.1 5.4" />
          </g>
        </symbol>
        <symbol id="i-data" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <ellipse cx="12" cy="6.4" rx="7.4" ry="3.1" />
            <path d="M4.6 6.4v11.2c0 1.7 3.3 3.1 7.4 3.1s7.4-1.4 7.4-3.1V6.4" />
            <path d="M4.6 12c0 1.7 3.3 3.1 7.4 3.1s7.4-1.4 7.4-3.1" />
          </g>
        </symbol>
        <symbol id="i-globe" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9">
            <circle cx="12" cy="12" r="8.7" />
            <path d="M3.4 12h17.2M12 3.3c2.5 2.4 3.8 5.4 3.8 8.7s-1.3 6.3-3.8 8.7c-2.5-2.4-3.8-5.4-3.8-8.7s1.3-6.3 3.8-8.7z" />
          </g>
        </symbol>
        <symbol id="i-sun" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.8v2.1M12 19.1v2.1M2.8 12h2.1M19.1 12h2.1M5.5 5.5l1.5 1.5M17 17l1.5 1.5M18.5 5.5 17 7M7 17l-1.5 1.5" />
          </g>
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="8.7" />
            <path d="M12 10.7v5.4" />
            <circle cx="12" cy="7.9" r="1.05" fill="currentColor" stroke="none" />
          </g>
        </symbol>
        <symbol id="i-doc" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round">
            <path d="M6 3.2h7.4L18 7.8v13H6z" />
            <path d="M13.2 3.5v4.5h4.6" stroke-linecap="round" />
            <path d="M9 12.4h6M9 15.6h6" stroke-linecap="round" />
          </g>
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 4H5.8A1.8 1.8 0 0 0 4 5.8v12.4A1.8 1.8 0 0 0 5.8 20h8.7" />
            <path d="M12.5 12H21M17.5 8.5 21 12l-3.5 3.5" />
          </g>
        </symbol>
        <symbol id="i-signal" viewBox="0 0 18 12">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor" />
          <rect x="5" y="6" width="3" height="6" rx="1" fill="currentColor" />
          <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="currentColor" />
          <rect x="15" y="1" width="3" height="11" rx="1" fill="currentColor" />
        </symbol>
        <symbol id="i-wifi" viewBox="0 0 16 12">
          <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.6 7a6.6 6.6 0 0 1 8.8 0M6 9.5a3.2 3.2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="8" cy="11" r="1" fill="currentColor" />
        </symbol>
        <symbol id="i-battery" viewBox="0 0 26 12">
          <rect x="0.7" y="1.2" width="22" height="9.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45" />
          <rect x="2.6" y="3.1" width="16.2" height="5.8" rx="1.8" fill="currentColor" />
          <path d="M24.4 4.2v3.6c.9-.3 1.4-.9 1.4-1.8s-.5-1.5-1.4-1.8z" fill="currentColor" opacity="0.45" />
        </symbol>
      </defs>
    </svg>

    <div class="phone settings-page">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12"><use href="#i-signal" /></svg>
          <svg width="16" height="12"><use href="#i-wifi" /></svg>
          <svg width="26" height="12"><use href="#i-battery" /></svg>
        </span>
      </div>

      <header class="settings-appbar">
        <button class="back-btn" aria-label="返回">
          <svg width="18" height="18"><use href="#i-back" /></svg>
        </button>
        <h1 class="settings-title">设置</h1>
        <span></span>
      </header>

      <div class="settings-content">
        <div class="settings-group">
          <div class="settings-label">服务器</div>
          <div class="settings-card">
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-server" /></svg></span>
              <span class="s-main">本机</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-label">账户</div>
          <div class="settings-card">
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-user" /></svg></span>
              <span class="s-main">账号管理</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-data" /></svg></span>
              <span class="s-main">数据管理</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-label">应用</div>
          <div class="settings-card">
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-globe" /></svg></span>
              <span class="s-main">语言</span>
              <span class="s-value">中文</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-sun" /></svg></span>
              <span class="s-main">外观</span>
              <span class="s-value">系统</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
            <div class="settings-row">
              <span class="s-icon"><span class="s-aa"><b>A</b><b>A</b></span></span>
              <span class="s-main">字体大小</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
          </div>
        </div>

        <div class="settings-group">
          <div class="settings-label">关于</div>
          <div class="settings-card">
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-info" /></svg></span>
              <span class="s-main">版本</span>
              <span class="s-value is-mono">0.1.5-official0.1.4</span>
            </div>
            <div class="settings-row">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-doc" /></svg></span>
              <span class="s-main">开源许可</span>
              <svg class="s-chevron"><use href="#i-chevron" /></svg>
            </div>
          </div>
        </div>

        <div class="settings-card is-standalone">
          <div class="settings-row">
            <span class="s-icon"><svg width="22" height="22"><use href="#i-logout" /></svg></span>
            <span class="s-main">退出登录</span>
          </div>
        </div>
      </div>

      <div class="scrim"></div>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <div class="modal-icon">
          <svg width="26" height="26"><use href="#i-globe" /></svg>
        </div>
        <p class="modal-title" id="m-title">语言</p>
        <div class="modal-list">
          <div class="modal-option"><span class="radio"></span>系统</div>
          <div class="modal-option">
            <span class="radio is-on"><span class="dot"></span></span>中文
          </div>
          <div class="modal-option"><span class="radio"></span>English</div>
        </div>
        <button class="modal-confirm" type="button">确认</button>
      </div>

      <div class="settings-footer">
        <div class="mono">chat-deepseek 0.1.5-official0.1.4</div>
        <div>内容由 AI 生成，请仔细甄别</div>
      </div>
    </div>
  </body>
</html>
