<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
    <title>21 本机账户（添加账户）</title>
    <link rel="stylesheet" href="../mockup.css" />
  </head>
  <body>
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M14.8 5.6 9.2 12l5.6 6.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="7.8" r="3.7" />
            <path d="M4.9 20.1c0-3.3 3.2-5.4 7.1-5.4s7.1 2.1 7.1 5.4" />
          </g>
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
          <path d="M12 3.2 19.2 6v5.6c0 4-3 7.2-7.2 9.2-4.2-2-7.2-5.2-7.2-9.2V6L12 3.2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-signal" viewBox="0 0 18 12">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor" />
          <rect x="5" y="6" width="3" height="6" rx="1" fill="currentColor" />
          <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="currentColor" />
          <rect x="15" y="1" width="3" height="11" rx="1" fill="currentColor" />
        </symbol>
        <symbol id="i-wifi" viewBox="0 0 16 12">
          <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.6 7a6.6 6.6 0 0 1 8.8 0M6 9.5a3.2 3.2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="8" cy="11" r="1" fill="currentColor" />
        </symbol>
        <symbol id="i-battery" viewBox="0 0 26 12">
          <rect x="0.7" y="1.2" width="22" height="9.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45" />
          <rect x="2.6" y="3.1" width="16.2" height="5.8" rx="1.8" fill="currentColor" />
          <path d="M24.4 4.2v3.6c.9-.3 1.4-.9 1.4-1.8s-.5-1.5-1.4-1.8z" fill="currentColor" opacity="0.45" />
        </symbol>
      </defs>
    </svg>

    <div class="phone settings-page">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12"><use href="#i-signal" /></svg>
          <svg width="16" height="12"><use href="#i-wifi" /></svg>
          <svg width="26" height="12"><use href="#i-battery" /></svg>
        </span>
      </div>

      <header class="settings-appbar">
        <button class="back-btn" aria-label="返回">
          <svg width="18" height="18"><use href="#i-back" /></svg>
        </button>
        <h1 class="settings-title">添加账户</h1>
        <span></span>
      </header>

      <div class="form-content">
        <div class="pill-field"><span>bob</span></div>
        <div class="pill-field"><span class="pw">●●●●●●●●</span></div>
        <div class="pill-field"><span class="pw">●●●●●●●●</span></div>
        <p class="pill-hint">密码至少 8 位。</p>

        <div class="settings-group">
          <div class="settings-label">角色</div>
          <div class="settings-card">
            <div class="settings-row is-double">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-user" /></svg></span>
              <div class="s-main">
                <div class="s-title">成员</div>
                <div class="s-sub">只能聊天</div>
              </div>
              <span class="radio is-on"><span class="dot"></span></span>
            </div>
            <div class="settings-row is-double">
              <span class="s-icon"><svg width="22" height="22"><use href="#i-shield" /></svg></span>
              <div class="s-main">
                <div class="s-title">管理员</div>
                <div class="s-sub">可以管理账户和备份</div>
              </div>
              <span class="radio"></span>
            </div>
          </div>
        </div>

        <button class="btn btn-primary btn-block pill-submit" type="button">创建</button>
      </div>
    </div>
  </body>
</html>
