<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
    <title>33 导入历史对话（确认弹窗）</title>
    <link rel="stylesheet" href="../mockup.css" />
  </head>
  <body>
    <svg aria-hidden="true" style="position: absolute; width: 0; height: 0; overflow: hidden">
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24">
          <path d="M14.8 5.6 9.2 12l5.6 6.4" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24">
          <path d="M9.6 5.8 15.9 12l-6.3 6.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
        </symbol>
        <symbol id="i-key" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8.2" cy="12" r="3.8" />
            <path d="M12 12h8.2" />
            <path d="M16.9 12v3.1M19.7 12v2.2" />
          </g>
        </symbol>
        <symbol id="i-export" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.6v9.8" />
            <path d="M8.4 7.2 12 3.6l3.6 3.6" />
            <path d="M4.6 14.6v3.8a1.6 1.6 0 0 0 1.6 1.6h11.6a1.6 1.6 0 0 0 1.6-1.6v-3.8" />
          </g>
        </symbol>
        <symbol id="i-import" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3.6v9.8" />
            <path d="M8.4 9.8 12 13.4l3.6-3.6" />
            <path d="M4.6 14.6v3.8a1.6 1.6 0 0 0 1.6 1.6h11.6a1.6 1.6 0 0 0 1.6-1.6v-3.8" />
          </g>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.8 6.5h14.4" />
            <path d="M9.4 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.6a1.3 1.3 0 0 1 1.3 1.3v1.7" />
            <path d="M6.7 6.5l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h5.6a1.6 1.6 0 0 0 1.6-1.5l.9-12.2" />
          </g>
        </symbol>
        <symbol id="i-signal" viewBox="0 0 18 12">
          <rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor" />
          <rect x="5" y="6" width="3" height="6" rx="1" fill="currentColor" />
          <rect x="10" y="3.5" width="3" height="8.5" rx="1" fill="currentColor" />
          <rect x="15" y="1" width="3" height="11" rx="1" fill="currentColor" />
        </symbol>
        <symbol id="i-wifi" viewBox="0 0 16 12">
          <path d="M1.2 4.4a10 10 0 0 1 13.6 0M3.6 7a6.6 6.6 0 0 1 8.8 0M6 9.5a3.2 3.2 0 0 1 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          <circle cx="8" cy="11" r="1" fill="currentColor" />
        </symbol>
        <symbol id="i-battery" viewBox="0 0 26 12">
          <rect x="0.7" y="1.2" width="22" height="9.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.45" />
          <rect x="2.6" y="3.1" width="16.2" height="5.8" rx="1.8" fill="currentColor" />
          <path d="M24.4 4.2v3.6c.9-.3 1.4-.9 1.4-1.8s-.5-1.5-1.4-1.8z" fill="currentColor" opacity="0.45" />
        </symbol>
      </defs>
    </svg>

    <div class="phone settings-page">
      <div class="statusbar">
        <span>9:41</span>
        <span class="sb-icons">
          <svg width="18" height="12"><use href="#i-signal" /></svg>
          <svg width="16" height="12"><use href="#i-wifi" /></svg>
          <svg width="26" height="12"><use href="#i-battery" /></svg>
        </span>
      </div>

      <header class="settings-appbar">
        <button class="back-btn" aria-label="返回">
          <svg width="18" height="18"><use href="#i-back" /></svg>
        </button>
        <h1 class="settings-title">数据管理</h1>
        <span></span>
      </header>

      <div class="server-content">
        <div class="settings-card">
          <div class="settings-row">
            <span class="s-icon"><svg width="22" height="22"><use href="#i-key" /></svg></span>
            <span class="s-main">API Key</span>
            <span class="s-value">已保存</span>
            <svg class="s-chevron"><use href="#i-chevron" /></svg>
          </div>
        </div>

        <div class="settings-card" style="margin-top: 24px">
          <div class="settings-row">
            <span class="s-icon"><svg width="22" height="22"><use href="#i-export" /></svg></span>
            <span class="s-main">导出所有历史对话</span>
            <svg class="s-chevron"><use href="#i-chevron" /></svg>
          </div>
          <div class="settings-row">
            <span class="s-icon"><svg width="22" height="22"><use href="#i-import" /></svg></span>
            <span class="s-main">导入历史对话</span>
            <svg class="s-chevron"><use href="#i-chevron" /></svg>
          </div>
        </div>

        <div class="settings-card is-standalone">
          <div class="settings-row is-danger">
            <span class="s-icon"><svg width="22" height="22"><use href="#i-trash" /></svg></span>
            <span class="s-main">删除所有对话</span>
          </div>
        </div>

        <p class="loop-note">删除后无法找回，服务器上的附件和草稿也会一起删除。</p>
      </div>

      <div class="scrim"></div>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <p class="modal-title" id="m-title">导入历史对话？</p>
        <p class="modal-body">文件会覆盖现有的全部对话和附件，原来的内容无法找回。</p>
        <div class="modal-actions">
          <button class="modal-cancel" type="button">取消</button>
          <button class="modal-danger" type="button">导入</button>
        </div>
      </div>
    </div>
  </body>
</html>
